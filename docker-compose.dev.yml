version: "3.9"

services:
  api-service:
    build:
      context: ./services/api-service
      dockerfile: Dockerfile.dev
    volumes:
      - ./services/api-service/src:/app/src
      - ./services/api-service/pom.xml:/app/pom.xml
    ports:
      - "8000:8000"
    environment:
      - SPRING_PROFILES_ACTIVE=dev
      - LOG_LEVEL=DEBUG

  websocket-service:
    build:
      context: ./services/websocket-service
      dockerfile: Dockerfile.dev
    volumes:
      - ./services/websocket-service/src:/app/src
      - ./services/websocket-service/pom.xml:/app/pom.xml
    ports:
      - "8001:8001"
    environment:
      - SPRING_PROFILES_ACTIVE=dev
      - LOG_LEVEL=DEBUG

  worker-service:
    build:
      context: ./services/worker-service
      dockerfile: Dockerfile.dev
    volumes:
      - ./services/worker-service/src:/app/src
      - ./services/worker-service/pom.xml:/app/pom.xml
    environment:
      - SPRING_PROFILES_ACTIVE=dev

  search-service:
    build:
      context: ./services/search-service
      dockerfile: Dockerfile.dev
    volumes:
      - ./services/search-service/src:/app/src
      - ./services/search-service/pom.xml:/app/pom.xml
    ports:
      - "8002:8002"
    environment:
      - SPRING_PROFILES_ACTIVE=dev
      - LOG_LEVEL=DEBUG

  frontend-web:
    build:
      context: ./frontend/web
      dockerfile: Dockerfile.dev
    volumes:
      - ./frontend/web/src:/app/src
    ports:
      - "3000:3000"
