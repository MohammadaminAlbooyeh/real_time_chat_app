server:
  port: ${PORT:8000}

spring:
  application:
    name: ${APP_NAME:API Service}
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/chat_db}
    username: ${DATABASE_USERNAME:postgres}
    password: ${DATABASE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: ${HIBERNATE_FORMAT_SQL:false}
    show-sql: ${JPA_SHOW_SQL:false}
  data:
    redis:
      url: ${REDIS_URL:redis://localhost:6379/0}
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 55MB

app:
  version: ${APP_VERSION:1.0.0}
  jwt:
    secret-key: ${JWT_SECRET_KEY:dev-secret-key-change-in-production}
    access-token-expire-minutes: ${JWT_ACCESS_TOKEN_EXPIRE_MINUTES:30}
    refresh-token-expire-days: ${JWT_REFRESH_TOKEN_EXPIRE_DAYS:7}
  cors:
    allowed-origins: ${ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
  pagination:
    default-limit: 50
    max-limit: 200
  rate-limit:
    requests-per-minute: 120
  upload:
    dir: ${UPLOAD_DIR:uploads}
    max-file-size: 52428800

logging:
  level:
    com.chatapp.api: ${LOG_LEVEL:INFO}
