server:
  port: ${PORT:8002}

spring:
  application:
    name: ${APP_NAME:Search Service}

elasticsearch:
  uris: ${ELASTICSEARCH_URL:http://localhost:9200}
  index-name: ${ELASTICSEARCH_INDEX:messages}

app:
  version: ${APP_VERSION:1.0.0}

logging:
  level:
    com.chatapp.search: ${LOG_LEVEL:INFO}
