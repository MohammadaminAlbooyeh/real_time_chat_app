server:
  port: ${PORT:8003}
spring:
  application:
    name: ${APP_NAME:Worker Service}
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/chat_db}
    username: ${DATABASE_USERNAME:postgres}
    password: ${DATABASE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
    show-sql: false
  task:
    scheduling:
      pool:
        size: 5
app:
  version: ${APP_VERSION:1.0.0}
  search-service:
    url: ${SEARCH_SERVICE_URL:http://search-service:8002}
logging:
  level:
    com.chatapp.worker: ${LOG_LEVEL:INFO}
