name: CD

on:
  push:
    branches: [main]
    tags: ['v*']

env:
  REGISTRY: ghcr.io
  IMAGE_TAG: ${{ github.sha }}

jobs:
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set Docker tags
        id: meta
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            VERSION=${GITHUB_REF#refs/tags/}
            echo "tags=${{ env.REGISTRY }}/${{ github.repository }}/api-service:${VERSION},${{ env.REGISTRY }}/${{ github.repository }}/api-service:latest" >> $GITHUB_OUTPUT
          else
            echo "tags=${{ env.REGISTRY }}/${{ github.repository }}/api-service:${IMAGE_TAG},${{ env.REGISTRY }}/${{ github.repository }}/api-service:edge" >> $GITHUB_OUTPUT
          fi

      - name: Build and push API service
        uses: docker/build-push-action@v5
        with:
          context: services/api-service
          push: true
          tags: ${{ steps.meta.outputs.tags }}

      - name: Build and push WebSocket service
        uses: docker/build-push-action@v5
        with:
          context: services/websocket-service
          push: true
          tags: ${{ env.REGISTRY }}/${{ github.repository }}/websocket-service:${{ env.IMAGE_TAG }}

      - name: Build and push Worker service
        uses: docker/build-push-action@v5
        with:
          context: services/worker-service
          push: true
          tags: ${{ env.REGISTRY }}/${{ github.repository }}/worker-service:${{ env.IMAGE_TAG }}

      - name: Build and push Search service
        uses: docker/build-push-action@v5
        with:
          context: services/search-service
          push: true
          tags: ${{ env.REGISTRY }}/${{ github.repository }}/search-service:${{ env.IMAGE_TAG }}

      - name: Build and push Frontend
        uses: docker/build-push-action@v5
        with:
          context: frontend/web
          push: true
          tags: ${{ env.REGISTRY }}/${{ github.repository }}/frontend-web:${{ env.IMAGE_TAG }}

      - name: Deploy to production
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          echo "Deploying tagged release ${{ github.ref_name }}"
