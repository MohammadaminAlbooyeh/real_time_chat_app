name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  PYTHON_VERSION: '3.12'
  NODE_VERSION: '20'

jobs:
  backend-lint-and-test:
    name: Backend Lint & Test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [api-service, websocket-service, search-service, worker-service]
    defaults:
      run:
        working-directory: services/${{ matrix.service }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff pytest pytest-asyncio pytest-cov

      - name: Lint with ruff
        run: ruff check . --output-format=github

      - name: Run tests
        run: pytest --cov=. --cov-report=xml --cov-report=term

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          file: services/${{ matrix.service }}/coverage.xml
          flags: ${{ matrix.service }}

  frontend-lint-and-build:
    name: Frontend Lint & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/web

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

  docker-build:
    name: Docker Build Check
    runs-on: ubuntu-latest
    needs: [backend-lint-and-test, frontend-lint-and-build]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build API service
        uses: docker/build-push-action@v5
        with:
          context: services/api-service
          push: false
          tags: chat-api:ci

      - name: Build WebSocket service
        uses: docker/build-push-action@v5
        with:
          context: services/websocket-service
          push: false
          tags: chat-ws:ci

      - name: Build Worker service
        uses: docker/build-push-action@v5
        with:
          context: services/worker-service
          push: false
          tags: chat-worker:ci

      - name: Build Search service
        uses: docker/build-push-action@v5
        with:
          context: services/search-service
          push: false
          tags: chat-search:ci

      - name: Build Frontend
        uses: docker/build-push-action@v5
        with:
          context: frontend/web
          push: false
          tags: chat-web:ci
