name: Security Scan

on:
  schedule:
    - cron: '0 6 * * 1'
  push:
    branches: [main]

jobs:
  scan:
    name: Security Audit
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Safety check dependencies
        run: |
          pip install safety
          safety check -r services/api-service/requirements.txt
          safety check -r services/websocket-service/requirements.txt
          safety check -r services/worker-service/requirements.txt
          safety check -r services/search-service/requirements.txt

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: npm audit
        run: |
          cd frontend/web && npm audit --audit-level=high || true

      - name: Trivy vulnerability scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: Upload Trivy results
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'trivy-results.sarif'
