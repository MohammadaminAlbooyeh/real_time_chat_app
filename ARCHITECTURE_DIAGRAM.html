<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Real-Time Chat Application Architecture</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            background: white;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 30px;
            max-width: 100%;
            overflow-x: auto;
        }
        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 30px;
            font-size: 24px;
        }
        .diagram-wrapper {
            display: flex;
            justify-content: center;
            overflow-x: auto;
        }
        svg {
            max-width: 100%;
            height: auto;
            min-width: 800px;
        }
        .legend {
            display: flex;
            gap: 20px;
            margin-top: 30px;
            flex-wrap: wrap;
            justify-content: center;
            border-top: 1px solid #eee;
            padding-top: 20px;
        }
        .legend-item {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
        }
        .legend-box {
            width: 20px;
            height: 20px;
            border-radius: 3px;
            flex-shrink: 0;
        }
        .frontend-box { background: #667eea; }
        .service-box { background: #f093fb; }
        .database-box { background: #4facfe; }
        .infra-box { background: #43e97b; }
        .external-box { background: #fa709a; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Real-Time Chat Application - System Architecture</h1>

        <div class="diagram-wrapper">
            <svg viewBox="0 0 1200 1000" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet">
                <defs>
                    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
                        <polygon points="0 0, 10 3, 0 6" fill="#666" />
                    </marker>
                    <marker id="arrowhead-dashed" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
                        <polygon points="0 0, 10 3, 0 6" fill="#999" />
                    </marker>
                </defs>

                <!-- Background -->
                <rect width="1200" height="1000" fill="#f9f9f9"/>

                <!-- ==================== CLIENTS LAYER ==================== -->
                <text x="600" y="35" font-size="18" font-weight="bold" text-anchor="middle" fill="#333">CLIENTS LAYER</text>

                <!-- Web Client -->
                <rect x="50" y="50" width="150" height="70" rx="6" fill="#667eea" stroke="#333" stroke-width="2"/>
                <text x="125" y="72" font-size="13" font-weight="bold" text-anchor="middle" fill="white">Web Client</text>
                <text x="125" y="88" font-size="11" text-anchor="middle" fill="white">React</text>
                <text x="125" y="102" font-size="10" text-anchor="middle" fill="white">or Vue</text>

                <!-- Mobile Client -->
                <rect x="250" y="50" width="150" height="70" rx="6" fill="#667eea" stroke="#333" stroke-width="2"/>
                <text x="325" y="72" font-size="13" font-weight="bold" text-anchor="middle" fill="white">Mobile App</text>
                <text x="325" y="88" font-size="11" text-anchor="middle" fill="white">React Native</text>
                <text x="325" y="102" font-size="10" text-anchor="middle" fill="white">or Flutter</text>

                <!-- Desktop Client -->
                <rect x="450" y="50" width="150" height="70" rx="6" fill="#667eea" stroke="#333" stroke-width="2"/>
                <text x="525" y="72" font-size="13" font-weight="bold" text-anchor="middle" fill="white">Desktop App</text>
                <text x="525" y="88" font-size="11" text-anchor="middle" fill="white">Electron</text>
                <text x="525" y="102" font-size="10" text-anchor="middle" fill="white">or Qt</text>

                <!-- External APIs -->
                <rect x="650" y="50" width="150" height="70" rx="6" fill="#fa709a" stroke="#333" stroke-width="2"/>
                <text x="725" y="72" font-size="13" font-weight="bold" text-anchor="middle" fill="white">External APIs</text>
                <text x="725" y="88" font-size="11" text-anchor="middle" fill="white">Webhooks</text>
                <text x="725" y="102" font-size="10" text-anchor="middle" fill="white">SDKs</text>

                <!-- Arrows from clients to nginx -->
                <line x1="125" y1="120" x2="125" y2="150" stroke="#666" stroke-width="2" marker-end="url(#arrowhead)"/>
                <line x1="325" y1="120" x2="325" y2="150" stroke="#666" stroke-width="2" marker-end="url(#arrowhead)"/>
                <line x1="525" y1="120" x2="525" y2="150" stroke="#666" stroke-width="2" marker-end="url(#arrowhead)"/>
                <line x1="725" y1="120" x2="725" y2="150" stroke="#666" stroke-width="2" marker-end="url(#arrowhead)"/>

                <!-- ==================== API GATEWAY / LOAD BALANCER ==================== -->
                <text x="600" y="150" font-size="18" font-weight="bold" text-anchor="middle" fill="#333">API GATEWAY</text>
                <rect x="100" y="160" width="1000" height="70" rx="6" fill="#43e97b" stroke="#333" stroke-width="2"/>
                <text x="600" y="185" font-size="13" font-weight="bold" text-anchor="middle" fill="#333">Nginx - Reverse Proxy, Load Balancer</text>
                <text x="600" y="205" font-size="11" text-anchor="middle" fill="#333">HTTP/WebSocket Routing | SSL/TLS | Rate Limiting | Compression</text>

                <!-- Arrows from gateway to services -->
                <line x1="250" y1="230" x2="200" y2="260" stroke="#666" stroke-width="2" marker-end="url(#arrowhead)"/>
                <line x1="500" y1="230" x2="500" y2="260" stroke="#666" stroke-width="2" marker-end="url(#arrowhead)"/>
                <line x1="750" y1="230" x2="750" y2="260" stroke="#666" stroke-width="2" marker-end="url(#arrowhead)"/>
                <line x1="950" y1="230" x2="950" y2="260" stroke="#666" stroke-width="2" marker-end="url(#arrowhead)"/>

                <!-- ==================== BACKEND SERVICES LAYER ==================== -->
                <text x="600" y="260" font-size="18" font-weight="bold" text-anchor="middle" fill="#333">MICROSERVICES LAYER</text>

                <!-- API Service -->
                <rect x="70" y="270" width="160" height="100" rx="6" fill="#f093fb" stroke="#333" stroke-width="2"/>
                <text x="150" y="295" font-size="12" font-weight="bold" text-anchor="middle" fill="white">API Service</text>
                <text x="150" y="312" font-size="10" text-anchor="middle" fill="white">• Users</text>
                <text x="150" y="325" font-size="10" text-anchor="middle" fill="white">• Auth</text>
                <text x="150" y="338" font-size="10" text-anchor="middle" fill="white">• CRUD Ops</text>
                <text x="150" y="351" font-size="9" text-anchor="middle" fill="white">REST API</text>

                <!-- WebSocket Service -->
                <rect x="320" y="270" width="160" height="100" rx="6" fill="#f093fb" stroke="#333" stroke-width="2"/>
                <text x="400" y="295" font-size="12" font-weight="bold" text-anchor="middle" fill="white">WebSocket Service</text>
                <text x="400" y="312" font-size="10" text-anchor="middle" fill="white">• Real-time Chat</text>
                <text x="400" y="325" font-size="10" text-anchor="middle" fill="white">• Connections</text>
                <text x="400" y="338" font-size="10" text-anchor="middle" fill="white">• Broadcasting</text>
                <text x="400" y="351" font-size="9" text-anchor="middle" fill="white">Node/Go</text>

                <!-- Search Service -->
                <rect x="570" y="270" width="160" height="100" rx="6" fill="#f093fb" stroke="#333" stroke-width="2"/>
                <text x="650" y="295" font-size="12" font-weight="bold" text-anchor="middle" fill="white">Search Service</text>
                <text x="650" y="312" font-size="10" text-anchor="middle" fill="white">• Full-text</text>
                <text x="650" y="325" font-size="10" text-anchor="middle" fill="white">• Indexing</text>
                <text x="650" y="338" font-size="10" text-anchor="middle" fill="white">• Queries</text>
                <text x="650" y="351" font-size="9" text-anchor="middle" fill="white">Elasticsearch</text>

                <!-- Worker Service -->
                <rect x="820" y="270" width="160" height="100" rx="6" fill="#f093fb" stroke="#333" stroke-width="2"/>
                <text x="900" y="295" font-size="12" font-weight="bold" text-anchor="middle" fill="white">Worker Service</text>
                <text x="900" y="312" font-size="10" text-anchor="middle" fill="white">• Background Jobs</text>
                <text x="900" y="325" font-size="10" text-anchor="middle" fill="white">• Notifications</text>
                <text x="900" y="338" font-size="10" text-anchor="middle" fill="white">• Email</text>
                <text x="900" y="351" font-size="9" text-anchor="middle" fill="white">Task Queue</text>

                <!-- Service interconnection -->
                <line x1="230" y1="320" x2="320" y2="320" stroke="#999" stroke-width="1.5" stroke-dasharray="4,4" marker-end="url(#arrowhead-dashed)"/>
                <line x1="480" y1="320" x2="570" y2="320" stroke="#999" stroke-width="1.5" stroke-dasharray="4,4" marker-end="url(#arrowhead-dashed)"/>
                <line x1="730" y1="320" x2="820" y2="320" stroke="#999" stroke-width="1.5" stroke-dasharray="4,4" marker-end="url(#arrowhead-dashed)"/>

                <!-- Arrows to databases -->
                <line x1="150" y1="370" x2="100" y2="410" stroke="#666" stroke-width="2" marker-end="url(#arrowhead)"/>
                <line x1="400" y1="370" x2="400" y2="410" stroke="#666" stroke-width="2" marker-end="url(#arrowhead)"/>
                <line x1="650" y1="370" x2="700" y2="410" stroke="#666" stroke-width="2" marker-end="url(#arrowhead)"/>
                <line x1="900" y1="370" x2="900" y2="410" stroke="#666" stroke-width="2" marker-end="url(#arrowhead)"/>

                <!-- ==================== DATA LAYER ==================== -->
                <text x="600" y="410" font-size="18" font-weight="bold" text-anchor="middle" fill="#333">DATA STORAGE LAYER</text>

                <!-- PostgreSQL -->
                <rect x="30" y="420" width="140" height="90" rx="6" fill="#4facfe" stroke="#333" stroke-width="2"/>
                <text x="100" y="445" font-size="12" font-weight="bold" text-anchor="middle" fill="white">PostgreSQL</text>
                <text x="100" y="462" font-size="10" text-anchor="middle" fill="white">• Users</text>
                <text x="100" y="475" font-size="10" text-anchor="middle" fill="white">• Messages</text>
                <text x="100" y="488" font-size="10" text-anchor="middle" fill="white">• Chats</text>
                <text x="100" y="501" font-size="9" text-anchor="middle" fill="white">Relational DB</text>

                <!-- Redis -->
                <rect x="330" y="420" width="140" height="90" rx="6" fill="#4facfe" stroke="#333" stroke-width="2"/>
                <text x="400" y="445" font-size="12" font-weight="bold" text-anchor="middle" fill="white">Redis</text>
                <text x="400" y="462" font-size="10" text-anchor="middle" fill="white">• Cache</text>
                <text x="400" y="475" font-size="10" text-anchor="middle" fill="white">• Sessions</text>
                <text x="400" y="488" font-size="10" text-anchor="middle" fill="white">• Pub/Sub</text>
                <text x="400" y="501" font-size="9" text-anchor="middle" fill="white">In-memory DB</text>

                <!-- Elasticsearch -->
                <rect x="630" y="420" width="140" height="90" rx="6" fill="#4facfe" stroke="#333" stroke-width="2"/>
                <text x="700" y="445" font-size="12" font-weight="bold" text-anchor="middle" fill="white">Elasticsearch</text>
                <text x="700" y="462" font-size="10" text-anchor="middle" fill="white">• Indexes</text>
                <text x="700" y="475" font-size="10" text-anchor="middle" fill="white">• Analytics</text>
                <text x="700" y="488" font-size="10" text-anchor="middle" fill="white">• Logs</text>
                <text x="700" y="501" font-size="9" text-anchor="middle" fill="white">Search Engine</text>

                <!-- Monitoring -->
                <rect x="930" y="420" width="140" height="90" rx="6" fill="#43e97b" stroke="#333" stroke-width="2"/>
                <text x="1000" y="445" font-size="12" font-weight="bold" text-anchor="middle" fill="#333">Monitoring</text>
                <text x="1000" y="462" font-size="10" text-anchor="middle" fill="#333">• Prometheus</text>
                <text x="1000" y="475" font-size="10" text-anchor="middle" fill="#333">• Grafana</text>
                <text x="1000" y="488" font-size="10" text-anchor="middle" fill="#333">• Logs</text>
                <text x="1000" y="501" font-size="9" text-anchor="middle" fill="#333">Observability</text>

                <!-- ==================== INFRASTRUCTURE LAYER ==================== -->
                <text x="600" y="560" font-size="18" font-weight="bold" text-anchor="middle" fill="#333">INFRASTRUCTURE LAYER</text>

                <!-- Docker -->
                <rect x="50" y="570" width="130" height="80" rx="6" fill="#43e97b" stroke="#333" stroke-width="2"/>
                <text x="115" y="595" font-size="11" font-weight="bold" text-anchor="middle" fill="#333">Docker</text>
                <text x="115" y="610" font-size="9" text-anchor="middle" fill="#333">Containers</text>
                <text x="115" y="625" font-size="9" text-anchor="middle" fill="#333">Images</text>

                <!-- Kubernetes -->
                <rect x="240" y="570" width="130" height="80" rx="6" fill="#43e97b" stroke="#333" stroke-width="2"/>
                <text x="305" y="595" font-size="11" font-weight="bold" text-anchor="middle" fill="#333">Kubernetes</text>
                <text x="305" y="610" font-size="9" text-anchor="middle" fill="#333">Orchestration</text>
                <text x="305" y="625" font-size="9" text-anchor="middle" fill="#333">Scaling</text>

                <!-- Cloud Storage -->
                <rect x="430" y="570" width="130" height="80" rx="6" fill="#43e97b" stroke="#333" stroke-width="2"/>
                <text x="495" y="595" font-size="11" font-weight="bold" text-anchor="middle" fill="#333">Cloud Storage</text>
                <text x="495" y="610" font-size="9" text-anchor="middle" fill="#333">AWS S3</text>
                <text x="495" y="625" font-size="9" text-anchor="middle" fill="#333">or GCS</text>

                <!-- CDN -->
                <rect x="620" y="570" width="130" height="80" rx="6" fill="#43e97b" stroke="#333" stroke-width="2"/>
                <text x="685" y="595" font-size="11" font-weight="bold" text-anchor="middle" fill="#333">CDN</text>
                <text x="685" y="610" font-size="9" text-anchor="middle" fill="#333">Content</text>
                <text x="685" y="625" font-size="9" text-anchor="middle" fill="#333">Delivery</text>

                <!-- CI/CD -->
                <rect x="810" y="570" width="130" height="80" rx="6" fill="#43e97b" stroke="#333" stroke-width="2"/>
                <text x="875" y="595" font-size="11" font-weight="bold" text-anchor="middle" fill="#333">CI/CD</text>
                <text x="875" y="610" font-size="9" text-anchor="middle" fill="#333">GitHub Actions</text>
                <text x="875" y="625" font-size="9" text-anchor="middle" fill="#333">Registry</text>

                <!-- Backup -->
                <rect x="1000" y="570" width="130" height="80" rx="6" fill="#43e97b" stroke="#333" stroke-width="2"/>
                <text x="1065" y="595" font-size="11" font-weight="bold" text-anchor="middle" fill="#333">Backup & DR</text>
                <text x="1065" y="610" font-size="9" text-anchor="middle" fill="#333">Replication</text>
                <text x="1065" y="625" font-size="9" text-anchor="middle" fill="#333">Recovery</text>

                <!-- ==================== DATA FLOW ==================== -->
                <text x="600" y="710" font-size="16" font-weight="bold" text-anchor="middle" fill="#333">Data Flow & Communication</text>

                <!-- Flow descriptions -->
                <rect x="50" y="730" width="1100" height="250" rx="6" fill="#f0f0f0" stroke="#ccc" stroke-width="1"/>

                <text x="70" y="755" font-size="12" font-weight="bold" fill="#333">1. Client Communication:</text>
                <text x="70" y="775" font-size="11" fill="#555">• Web/Mobile/Desktop clients connect to Nginx load balancer</text>
                <text x="70" y="792" font-size="11" fill="#555">• HTTP requests → API Service for REST operations</text>
                <text x="70" y="809" font-size="11" fill="#555">• WebSocket connections → WebSocket Service for real-time messaging</text>

                <text x="70" y="840" font-size="12" font-weight="bold" fill="#333">2. Backend Processing:</text>
                <text x="70" y="860" font-size="11" fill="#555">• API Service handles user management and CRUD operations</text>
                <text x="70" y="877" font-size="11" fill="#555">• WebSocket Service manages real-time connections and broadcasts messages</text>
                <text x="70" y="894" font-size="11" fill="#555">• Search Service indexes messages for full-text search capabilities</text>
                <text x="70" y="911" font-size="11" fill="#555">• Worker Service handles background jobs and notifications asynchronously</text>

                <text x="70" y="942" font-size="12" font-weight="bold" fill="#333">3. Data Persistence:</text>
                <text x="70" y="962" font-size="11" fill="#555">• PostgreSQL stores persistent data (users, conversations, messages)</text>
                <text x="70" y="979" font-size="11" fill="#555">• Redis caches frequently accessed data and manages message queues</text>
                <text x="70" y="996" font-size="11" fill="#555">• Elasticsearch indexes messages for fast searching and analytics</text>
            </svg>
        </div>

        <div class="legend">
            <div class="legend-item">
                <div class="legend-box frontend-box"></div>
                <span>Frontend Clients</span>
            </div>
            <div class="legend-item">
                <div class="legend-box service-box"></div>
                <span>Microservices</span>
            </div>
            <div class="legend-item">
                <div class="legend-box database-box"></div>
                <span>Data Storage</span>
            </div>
            <div class="legend-item">
                <div class="legend-box infra-box"></div>
                <span>Infrastructure</span>
            </div>
            <div class="legend-item">
                <div class="legend-box external-box"></div>
                <span>External Services</span>
            </div>
        </div>
    </div>
</body>
</html>
